<!DOCTYPE html>
<html>
<head>
    <title>Testimonials</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            font-family: serif;
        }

        .main-container {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .testimonial {
            background-color: white;
            border: 1px solid #d3d3d3;
            padding: 15px;
            margin-bottom: 15px;
        }

        .author {
            text-align: right;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Testimonials</h1>

        <div class="testimonial">
            <p>
                This product is amazing! I highly recommend it to anyone in need
                of a solution like this.
            </p>
            <p class="author">- John Doe</p>
        </div>

        <div class="testimonial">
            <p>
                I have been using this for a few weeks now and it has completely
                transformed my workflow.
            </p>
            <p class="author">- Jane Smith</p>
        </div>
    </div>
</body>
</html>
